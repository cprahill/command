<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>HARNESS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#03060c; --panel:#070d16; --line:#1a2a3e; --muted:#6d7d93;
  --text:#d7e6f5; --cyan:#3ce7ff; --mint:#3dffc7; --gold:#ffb020;
  --pink:#ff4d8d; --violet:#8b7cff; --green:#3dff9a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"IBM Plex Mono",ui-monospace,monospace;}
.app{height:100%;display:grid;grid-template-rows:48px 1fr 168px;gap:0}
header{
  display:flex;align-items:center;gap:14px;
  padding:0 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,#050a12,#0a1220 40%,#050a12);
}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.22em;font-size:17px;color:#fff;}
.brand i{color:var(--cyan);font-style:normal;text-shadow:0 0 12px #3ce7ff88}
.chip{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border:1px solid var(--line);border-radius:2px;color:var(--muted);
}
.chip.paper{color:var(--gold);border-color:#5a4318}
.chip.crew{color:var(--mint);border-color:#1e5a4a;box-shadow:0 0 10px #3dffc733}
.chip.gate{color:var(--cyan);border-color:#1a5a66;box-shadow:0 0 10px #3ce7ff33}
.live{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;color:var(--green)}
.live b{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.kpis{margin-left:auto;display:flex;gap:20px;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.kpis strong{display:block;color:#fff;font-family:"Space Grotesk",sans-serif;font-size:15px;letter-spacing:0;text-transform:none;margin-top:1px}
.tok{display:flex;align-items:center;gap:10px;min-width:220px;max-width:340px;font-size:10px;color:var(--muted)}
.tokstack{flex:1;height:6px;display:flex;background:#152033;border-radius:2px;overflow:hidden}
.tokstack i{height:100%;min-width:0}
.mesh{
  position:relative;min-height:0;overflow:hidden;
  background:
    radial-gradient(900px 420px at 50% 48%, #10243c 0%, transparent 62%),
    radial-gradient(600px 280px at 78% 50%, #1a1030 0%, transparent 55%),
    #03060c;
}
.mesh canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.mesh canvas:active{cursor:grabbing}
.mbanner{
  position:absolute;left:16px;top:12px;z-index:3;
  font-family:"Barlow Condensed",sans-serif;letter-spacing:.18em;font-size:11px;
  color:var(--cyan);text-shadow:0 0 12px #3ce7ff55;
}
.call{
  position:absolute;z-index:4;transform:translate(-50%,-145%);
  background:#0a121c;border:1px solid var(--cyan);color:#e8fff9;
  font-size:10px;padding:3px 7px;white-space:nowrap;pointer-events:none;
  box-shadow:0 0 14px #3ce7ff33;
}
.bot{display:grid;grid-template-columns:1.2fr .8fr;border-top:1px solid var(--line);min-height:0;background:var(--panel)}
.panel{padding:12px 16px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.panel + .panel{border-left:1px solid var(--line)}
.ph{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px}
.feed{font-size:12px;line-height:1.55;flex:1;min-height:0;overflow:auto}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .t{color:var(--muted);margin-right:8px}
.feed .tag{margin-right:8px;font-size:10px;letter-spacing:.08em}
.feed .tag.ok{color:var(--cyan)} .feed .tag.hot{color:var(--gold)}
.feed .tag.warn{color:var(--gold)} .feed .tag.bad{color:var(--pink)}
.feed .tag.crew{color:var(--mint)}
.docs{font-size:12px;line-height:1.5;flex:1;min-height:0;overflow:auto;margin:0;padding-left:16px;color:var(--text)}
.docs li{margin-bottom:4px}
@media (max-width:900px){
  html,body{height:100%!important;width:100%;overflow:hidden!important;position:fixed!important;inset:0;-webkit-text-size-adjust:100%}
  .app{height:100dvh!important;max-height:100dvh!important;overflow-x:hidden!important;overflow-y:scroll!important;
    -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;
    grid-template-rows:auto minmax(240px,42vh) auto!important;gap:0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px))}
  header{flex-wrap:wrap;height:auto;padding:10px 12px;gap:8px 12px}
  .kpis{order:4;flex:1 1 100%;margin-left:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tok{order:5;flex:1 1 100%;max-width:none}
  .mesh{min-height:240px;height:42vh;max-height:48vh;width:100%}
  .bot{grid-template-columns:1fr!important;height:auto}
  .panel + .panel{border-left:none;border-top:1px solid var(--line)}
  .panel{min-height:160px;overflow:visible}
  .feed,.docs{overflow:visible;height:auto}
  .feed div{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4;padding:3px 0}
}
@media (max-width:420px){.mesh{height:36vh;min-height:200px}}
.feed,.docs{overflow:auto;-webkit-overflow-scrolling:touch}

/* mobile align — stack columns; .app scrolls. Build look unchanged. */
@media (max-width:900px){
  html,body{height:100%!important;width:100%;overflow:hidden!important;position:fixed!important;inset:0;-webkit-text-size-adjust:100%}
  .app{
    height:100dvh!important;max-height:100dvh!important;
    overflow-x:hidden!important;overflow-y:scroll!important;
    -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;
    grid-template-rows:auto minmax(240px,42vh) auto!important;
    gap:0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));
  }
  header{flex-wrap:wrap;height:auto;padding:10px 12px;gap:8px 12px}
  .kpis{order:4;flex:1 1 100%;margin-left:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tok{order:5;flex:1 1 100%;max-width:none}
  .mesh{min-height:240px;height:42vh;max-height:48vh;width:100%}
  .mesh canvas{width:100%!important;height:100%!important}
  .bot{grid-template-columns:1fr!important;height:auto}
  .panel + .panel{border-left:none;border-top:1px solid var(--line)}
  .panel{min-height:160px;overflow:visible}
  .feed,.docs{overflow:visible;height:auto}
  .feed div{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4;padding:3px 0}
}
@media (max-width:420px){
  .mesh{height:36vh;min-height:200px}
}
.feed,.docs{overflow:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">HARNESS <i>//</i> NEURAL 3D</div>
    <a href="../" style="color:#3ce7ff;text-decoration:none;font-family:Barlow Condensed,sans-serif;letter-spacing:.14em;font-size:11px">COMMAND</a>
    <a href="../harness/" style="color:#ffb020;text-decoration:none;font-family:Barlow Condensed,sans-serif;letter-spacing:.14em;font-size:11px">HARNESS</a>
    <a href="../paper/" style="color:#14f195;text-decoration:none;font-family:Barlow Condensed,sans-serif;letter-spacing:.14em;font-size:11px">PAPER</a>
    <div class="chip paper" id="scream">PAPER</div>
    <div class="chip gate" id="gatechip">FIRST GATE</div>
    <div class="chip" id="crewchip">CREW</div>
    <div class="live"><b></b>LIVE</div>
    <div class="tok" title="tokens 24h">
      <div class="tokstack" id="tokstack"></div>
      <span id="toksum">—</span>
    </div>
    <div class="kpis">
      <div>Paper<strong id="kEq">—</strong></div>
      <div>Master<strong id="kMaster">0</strong></div>
      <div>Clock<strong id="kClk">--:--:--</strong></div>
    </div>
  </header>
  <section class="mesh">
    <div class="mbanner" id="mbanner">DRAG TO ORBIT</div>
    <canvas id="c"></canvas>
    <div id="calls"></div>
  </section>
  <section class="bot">
    <article class="panel">
      <div class="ph">LOG</div>
      <div class="feed" id="feed"></div>
    </article>
    <article class="panel">
      <div class="ph">LESSONS</div>
      <ul class="docs" id="lessons"></ul>
    </article>
  </section>
</div>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
let W=0,H=0,T=0,S=null,jobs=[],seen=new Set();
let yaw=0.55, pitch=0.32, dist=2.15, drag=false, lx=0, ly=0, auto=true;
const COL={
  imsg:'#3ce7ff', gemma:'#3dff9a', qwen:'#3ce7ff', host:'#9aa8b8',
  locks:'#8b7cff', build:'#ffb020', bot:'#8b7cff', oc:'#3dffc7',
  first:'#3ce7ff', review:'#ffb020', verify:'#ffffff', master:'#ff4d8d',
  baja:'#ff6a3d', twin:'#7ed0ff', paper:'#ffe08a', park:'#ff4d8d'
};
const N={
  imsg:{x:.10,y:.50,z:-.42,label:'IMSG', kind:'ai', sub:'OC CHANNEL'},
  gemma:{x:.18,y:.16,z:-.38,label:'GEMMA', kind:'ai', sub:'12B'},
  host:{x:.18,y:.40,z:-.38,label:'HOST', kind:'ai', sub:'0-LLM CLOCK'},
  qwen:{x:.18,y:.64,z:-.38,label:'QWEN', kind:'ai', sub:'27B'},
  locks:{x:.18,y:.86,z:-.32,label:'LOCKS', kind:'gate', sub:'DISK'},
  build:{x:.34,y:.18,z:.04,label:'BUILD', kind:'ai', sub:'CONDUCTOR'},
  oc:{x:.44,y:.50,z:.08,label:'OPENCLAW', kind:'gate', sub:'GATEWAY'},
  bot:{x:.34,y:.84,z:.04,label:'BOT', kind:'ai', sub:'ALLOW'},
  first:{x:.56,y:.50,z:.32,label:'FIRST', kind:'hex', sub:'GATE'},
  review:{x:.70,y:.24,z:.52,label:'REVIEW', kind:'gate', sub:'LESSONS'},
  verify:{x:.70,y:.76,z:.52,label:'VERIFY', kind:'gate', sub:'APPLY·TEST'},
  baja:{x:.78,y:.10,z:.55,label:'A BAJA', kind:'dest'},
  twin:{x:.92,y:.32,z:.72,label:'B TWIN', kind:'dest'},
  paper:{x:.86,y:.58,z:.88,label:'C DESK', kind:'dest'},
  park:{x:.92,y:.88,z:.90,label:'PARKED', kind:'park'},
  master:{x:.96,y:.50,z:.98,label:'MASTER', kind:'hex', sub:'CLONE'}
};
const FALLBACK={
  gate:['locks','first','build','review','verify','first','master'],
  first:['locks','first','build','review','verify','first','master'],
  crew:['first','build','oc','review','verify','paper','first','master'],
  clock:['first','oc','review','verify','paper','first','master'],
  baja:['first','build','review','verify','baja','first','master'],
  cheap:['first','oc','review','verify','paper','first','master'],
  local:['first','gemma','oc','review','verify','paper','first','master'],
  cut:['first','qwen','oc','review','verify','twin','first','master'],
  cloud:['first','bot','review','verify','first','master'],
  imsg:['imsg','oc']
};
const WIRES=[
  {a:'imsg',b:'oc', kind:'plug'},
  {a:'gemma',b:'oc', kind:'plug'},
  {a:'qwen',b:'oc', kind:'plug'},
  {a:'host',b:'oc', kind:'plug'},
  {a:'bot',b:'oc', kind:'plug'},
  {a:'locks',b:'first', kind:'gate'},
  {a:'host',b:'first', kind:'gate'},
  {a:'build',b:'first', kind:'gate'},
  {a:'oc',b:'first', kind:'gate'},
  {a:'bot',b:'first', kind:'gate'},
  {a:'build',b:'review', kind:'review'},
  {a:'oc',b:'review', kind:'review'},
  {a:'bot',b:'review', kind:'review'},
  {a:'first',b:'review', kind:'review'},
  {a:'review',b:'verify', kind:'verify'},
  {a:'first',b:'verify', kind:'verify'},
  {a:'verify',b:'baja', kind:'ship'},
  {a:'verify',b:'twin', kind:'ship'},
  {a:'verify',b:'paper', kind:'ship'},
  {a:'baja',b:'first', kind:'back'},
  {a:'twin',b:'first', kind:'back'},
  {a:'paper',b:'first', kind:'back'},
  {a:'park',b:'first', kind:'reject'}
];
function pathMap(){
  const o={...FALLBACK};
  if(S&&S.paths) Object.keys(S.paths).forEach(k=>{ if(S.paths[k].nodes) o[k]=S.paths[k].nodes.filter(n=>N[n]); });
  return o;
}
function hexA(h,a){const n=h.replace('#','');return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})`;}
function live(id){
  const map={oc:'openclaw'};
  return (S&&S.nodes&&S.nodes[map[id]||id])||{};
}
function isWork(id){
  const pulse=(S&&S.pulse)||[];
  return !!(live(id).working || pulse.includes(id) || (id==='oc'&&pulse.includes('oc')));
}
function resize(){
  const r=C.parentElement.getBoundingClientRect();
  W=r.width; H=r.height;
  C.width=W*devicePixelRatio; C.height=H*devicePixelRatio;
  C.style.width=W+'px'; C.style.height=H+'px';
  X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function project(id){
  const n=N[id];
  let x=(n.x-0.5)*2.05, y=(n.y-0.5)*1.65, z=n.z;
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  let x1=x*cy-z*sy, z1=x*sy+z*cy;
  let y1=y*cp-z1*sp, z2=y*sp+z1*cp;
  const f=dist, s=f/(f+z2+0.55);
  return {x:W*0.50+x1*s*W*0.40, y:H*0.50+y1*s*H*0.46, s, z:z2, id};
}
function P(id){return project(id);}
function hexagon(x,y,r){
  X.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/6+i*Math.PI/3;
    if(i) X.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
    else X.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
  }
  X.closePath();
}
function neuron(p,col,on){
  const r=(on?13:10)*p.s;
  X.save();
  X.shadowColor=col; X.shadowBlur=on?18*p.s:6*p.s;
  X.beginPath(); X.arc(p.x,p.y,r,0,Math.PI*2);
  X.fillStyle=hexA('#050b14',.94); X.fill();
  X.strokeStyle=col; X.lineWidth=on?2.1:1.15; X.stroke();
  X.shadowBlur=0;
  X.globalAlpha=on?0.95:0.45;
  X.beginPath(); X.arc(p.x,p.y,r*0.32,0,Math.PI*2); X.fillStyle=col; X.fill();
  X.globalAlpha=1;
  for(let i=0;i<6;i++){
    const a=T*0.55+i*Math.PI/3;
    X.beginPath();
    X.moveTo(p.x+Math.cos(a)*r, p.y+Math.sin(a)*r);
    X.lineTo(p.x+Math.cos(a)*(r+5*p.s), p.y+Math.sin(a)*(r+5*p.s));
    X.strokeStyle=hexA(col,on?0.7:0.22); X.lineWidth=1; X.stroke();
  }
  X.restore();
}
function diamond(p,s,col,on){
  const k=s*p.s;
  X.save();
  X.shadowColor=col; X.shadowBlur=on?14:4;
  X.beginPath();
  X.moveTo(p.x,p.y-k); X.lineTo(p.x+k*0.85,p.y); X.lineTo(p.x,p.y+k); X.lineTo(p.x-k*0.85,p.y); X.closePath();
  X.fillStyle=hexA('#050b14',.94); X.fill();
  X.strokeStyle=col; X.lineWidth=on?2:1.15; X.stroke();
  X.restore();
}
function drawHexGate(p,col,on,big){
  const r=(big?(on?24:20):(on?15:12))*p.s;
  X.save();
  X.shadowColor=col; X.shadowBlur=on?24:7;
  hexagon(p.x,p.y,r);
  X.fillStyle=hexA('#050b14',.95); X.fill();
  X.strokeStyle=col; X.lineWidth=on?2.4:1.4; X.stroke();
  X.shadowBlur=0;
  hexagon(p.x,p.y,r*0.55);
  X.strokeStyle=hexA(col,on?0.7:0.25); X.lineWidth=1; X.stroke();
  X.restore();
}
function projectPt(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  let x1=x*cy-z*sy, z1=x*sy+z*cy;
  let y1=y*cp-z1*sp, z2=y*sp+z1*cp;
  const f=dist, s=f/(f+z2+0.55);
  return {x:W*0.50+x1*s*W*0.40, y:H*0.50+y1*s*H*0.46, s, z:z2};
}
function drawFloor(){
  X.save();
  for(let i=-5;i<=5;i++){
    for(let j=-5;j<=5;j++){
      const a=projectPt(i*0.18, 0.92, j*0.16);
      const b=projectPt((i+1)*0.18, 0.92, j*0.16);
      const c=projectPt(i*0.18, 0.92, (j+1)*0.16);
      if(!a||!b) continue;
      X.strokeStyle='rgba(60,231,255,0.06)'; X.lineWidth=1;
      X.beginPath(); X.moveTo(a.x,a.y); X.lineTo(b.x,b.y); X.stroke();
      if(c){ X.beginPath(); X.moveTo(a.x,a.y); X.lineTo(c.x,c.y); X.stroke(); }
    }
  }
  X.restore();
}
function cable3(A,B,col,on,dash,width){
  const a=Math.max(0.2, Math.min(1, (A.s+B.s)/2));
  X.beginPath(); X.moveTo(A.x,A.y); X.lineTo(B.x,B.y);
  X.setLineDash(dash||[]);
  if(dash&&dash.length) X.lineDashOffset=-(T*22);
  X.strokeStyle=hexA(col, (on?0.88:0.36)*a);
  X.lineWidth=(on?(width||2.1):1.15)*a;
  X.shadowColor=on?col:'transparent'; X.shadowBlur=on?8:0;
  X.stroke();
  X.setLineDash([]); X.lineDashOffset=0; X.shadowBlur=0;
}
function tag3(txt,p,col,on,oy){
  X.font=`700 ${Math.max(8,10*p.s)|0}px Barlow Condensed,sans-serif`;
  X.textAlign='center'; X.textBaseline='middle';
  X.fillStyle=hexA(col, on?0.95:0.5);
  X.fillText(txt, p.x, p.y+(oy||0)*p.s);
}
function drawWires(){
  const Gb=P('build'), Bt=P('bot'), Oc=P('oc'), Ft=P('first'), Ms=P('master');
  const pairOn=isWork('build')||isWork('bot');
  const crewOn=isWork('build')||isWork('oc');
  const gateOn=isWork('first');
  [[-3,COL.build],[3,COL.bot]].forEach(([off,col])=>{
    cable3({x:Gb.x+off,y:Gb.y,s:Gb.s},{x:Bt.x+off,y:Bt.y,s:Bt.s}, col, pairOn, [], 2.4);
  });
  tag3('WIRED', {x:(Gb.x+Bt.x)/2-18, y:(Gb.y+Bt.y)/2, s:(Gb.s+Bt.s)/2}, '#ffb020', pairOn, 0);
  [[-2,COL.build],[2,COL.oc]].forEach(([off,col])=>{
    cable3({x:Gb.x+off,y:Gb.y,s:Gb.s},{x:Oc.x+off,y:Oc.y,s:Oc.s}, col, crewOn, [], 2.6);
  });
  tag3('CREW', {x:(Gb.x+Oc.x)/2, y:(Gb.y+Oc.y)/2, s:(Gb.s+Oc.s)/2}, '#3dffc7', crewOn, -10);
  [[-3,COL.first],[3,COL.master]].forEach(([off,col])=>{
    cable3({x:Ft.x+off,y:Ft.y,s:Ft.s},{x:Ms.x+off,y:Ms.y,s:Ms.s}, col, gateOn, [], 2.8);
  });
  tag3('CLONE', {x:(Ft.x+Ms.x)/2, y:(Ft.y+Ms.y)/2, s:(Ft.s+Ms.s)/2}, '#3ce7ff', gateOn, -12);
  const style={
    plug:{dash:[4,5], w:1.5},
    gate:{dash:[], w:1.7},
    review:{dash:[], w:2},
    verify:{dash:[], w:2},
    ship:{dash:[5,6], w:1.5},
    back:{dash:[], w:1.4},
    reject:{dash:[2,8], w:1.05}
  };
  WIRES.forEach(w=>{
    const A=P(w.a), B=P(w.b);
    const on=(isWork(w.a)||isWork(w.b)) && w.kind!=='reject';
    const st=style[w.kind]||style.plug;
    cable3(A,B, COL[w.a]||'#3ce7ff', on, st.dash, st.w);
  });
  tag3('REVIEW', P('review'), COL.review, isWork('review')||isWork('first'), -22);
  tag3('VERIFY', P('verify'), '#fff', isWork('verify'), 22);
}
function along(path,t){
  const segs=Math.max(1,path.length-1), f=Math.min(segs-.0001,Math.max(0,t)*segs), i=Math.floor(f), u=f-i;
  const a=path[i], b=path[i+1]||path[i];
  if(!N[a]||!N[b]) return {x:0,y:0,s:1};
  const A=P(a), B=P(b);
  return {x:A.x+(B.x-A.x)*u, y:A.y+(B.y-A.y)*u, s:(A.s+B.s)/2};
}
function drawJobs(){
  jobs=jobs.filter(j=>!j.dead);
  jobs.forEach(j=>{
    j.t+=j.v; if(j.t>=1) j.dead=true;
    const p=along(j.path,j.t);
    X.beginPath(); X.arc(p.x,p.y,3.2*(p.s||1),0,Math.PI*2);
    X.fillStyle=j.col; X.shadowColor=j.col; X.shadowBlur=12; X.fill(); X.shadowBlur=0;
  });
}
function drawNodes(){
  Object.keys(N).map(id=>{
    const p=P(id); p._id=id; return p;
  }).sort((a,b)=>a.z-b.z).forEach(p=>{
    const id=p._id, on=isWork(id), col=COL[id]||'#3ce7ff', kind=N[id].kind||'ai';
    if(on){
      X.beginPath(); X.arc(p.x,p.y,(kind==='hex'?28:18)*p.s+Math.sin(T*4)*2,0,Math.PI*2);
      X.strokeStyle=hexA(col,.32); X.lineWidth=1.1; X.stroke();
    }
    if(kind==='hex') drawHexGate(p,col,on,id==='first');
    else if(kind==='dest') diamond(p,on?12:10,col,on);
    else if(kind==='park') diamond(p,9,col,false);
    else if(kind==='gate') drawHexGate(p,col,on,false);
    else neuron(p,col,on);
    X.font=`600 ${Math.max(8,10*p.s)|0}px Barlow Condensed,sans-serif`;
    X.textAlign='center'; X.textBaseline='top';
    X.fillStyle=on?'#fff':hexA('#d7e6f5', id==='park'?.4:.8);
    X.fillText(N[id].label, p.x, p.y+(kind==='hex'?24:15)*p.s);
    if(N[id].sub){
      X.font=`600 ${Math.max(7,8*p.s)|0}px IBM Plex Mono,monospace`;
      X.fillStyle=hexA(col, on?.8:.45);
      X.fillText(N[id].sub, p.x, p.y+(kind==='hex'?36:27)*p.s);
    }
  });
}
let lastSpawn=0;
function keepJobs(ts){
  if(!S) return;
  if(ts-lastSpawn<900) return;
  lastSpawn=ts;
  const Pths=pathMap();
  const pulse=(S.pulse||[]);
  const crewOn=pulse.includes('build')&&pulse.includes('oc');
  const gateOn=pulse.includes('first');
  const bajaOn=pulse.includes('baja');
  let liveN=jobs.filter(j=>!j.dead).length;
  if(bajaOn && liveN<6){
    jobs.push({path:['first','build','review','verify','baja'], t:0, v:0.005, col:COL.baja});
    jobs.push({path:['verify','baja'], t:0, v:0.008, col:COL.build});
    jobs.push({path:['baja','first','master'], t:0, v:0.006, col:COL.baja});
    liveN+=3;
  }
  if(liveN>=5 && !bajaOn) return;
  if(crewOn && liveN<6){
    jobs.push({path:['build','oc'], t:0, v:0.008, col:COL.build});
    jobs.push({path:['oc','build'], t:0, v:0.008, col:COL.oc});
    liveN+=2;
  }
  if(gateOn && liveN<5){
    jobs.push({path:['first','master'], t:0, v:0.007, col:COL.first});
    jobs.push({path:['locks','first'], t:0, v:0.007, col:COL.locks});
    liveN+=2;
  }
  if(pulse.includes('build') && liveN<6) jobs.push({path:['build','review','verify'], t:0, v:0.006, col:COL.build});
  if(pulse.includes('oc') && !crewOn && liveN<6) jobs.push({path:['oc','review','verify'], t:0, v:0.006, col:COL.oc});
  if(pulse.includes('imsg')) jobs.push({path:['imsg','oc'], t:0, v:0.01, col:COL.imsg});
  let key='gate';
  if(bajaOn) key='baja';
  else if(crewOn) key='crew';
  else if(pulse.includes('imsg')) key='imsg';
  else if(pulse.includes('build')) key='gate';
  else if(pulse.includes('bot')) key='cloud';
  else if(pulse.includes('paper')||pulse.includes('oc')) key='clock';
  const path=(Pths[key]||FALLBACK.gate).filter(n=>N[n]);
  if(path.length>=2 && liveN<6) jobs.push({path, t:0, v:0.0036, col:COL[path[0]]||COL.first});
}
function frame(ts){
  T=ts/1000;
  if(auto) yaw+=0.00115;
  if(W<20||H<20) resize();
  keepJobs(ts);
  X.clearRect(0,0,W,H);
  drawFloor(); drawWires(); drawJobs(); drawNodes();
  requestAnimationFrame(frame);
}
function fmtT(n){
  n=Number(n)||0;
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'k';
  return String(n);
}
function render(){
  if(!S) return;
  const ageMs=S.updated_at? (Date.now()-Date.parse(S.updated_at)) : 9e9;
  const ageS=Math.max(0, Math.floor(ageMs/1000));
  const fresh=ageS<45 || S.mesh_live;
  const example=/example/i.test(S.scream||'') && !S.mesh_live;
  const liveEl=document.querySelector('.live');
  if(liveEl){
    liveEl.innerHTML=example?'<b></b>EXAMPLE':(fresh?'<b></b>LIVE':'<b></b>STALE');
    liveEl.style.color=example||!fresh?'var(--gold)':'';
  }
  const sc=document.getElementById('scream');
  if(sc) sc.textContent=(S.scream||'PAPER / not live').split('/')[0].trim()||'PAPER';
  document.getElementById('kMaster').textContent=(S.master||[]).length;
  const nw=S.net_worth||{};
  document.getElementById('kEq').textContent=(nw.equity!=null)?'$'+nw.equity.toFixed(0):'—';
  const toks=((S.tokens&&S.tokens.models)||[]).filter(m=>m.meter!=='none');
  const tokTotal=(S.tokens&&S.tokens.total)||0;
  document.getElementById('tokstack').innerHTML=toks.map(m=>{
    const w=tokTotal? Math.max(m.total?1.5:0, (m.total/tokTotal)*100) : 0;
    return `<i style="width:${w}%;background:${m.color||'#3ce7ff'};opacity:${m.total?1:.2}" title="${m.label} ${fmtT(m.total)}"></i>`;
  }).join('');
  const top=toks.slice().sort((a,b)=>(b.total||0)-(a.total||0))[0];
  document.getElementById('toksum').textContent=top? fmtT(tokTotal)+' · '+(top.label||'').split(' ')[0] : fmtT(tokTotal);
  const docs=S.docs||{};
  document.getElementById('lessons').innerHTML=(docs.lessons||[]).slice(0,6).map(x=>`<li>${x}</li>`).join('')||'<li>LESSONS.md empty</li>';
  document.getElementById('feed').innerHTML=(S.feed||[]).slice(-12).reverse().map(r=>
    `<div><span class="t">${r.t}</span><span class="tag ${r.tone}${r.tag==='CREW'||r.tag==='FIRST'?' crew':''}">${r.tag}</span>${r.line}</div>`
  ).join('');
  const pulse=(S.pulse||[]);
  const crew=pulse.includes('build')&&pulse.includes('oc');
  const gate=pulse.includes('first');
  const baja=pulse.includes('baja');
  document.getElementById('mbanner').textContent=baja
    ?'3D · A BAJA · playable in-flight'
    :(gate
      ?(crew?'3D · FIRST GATE · BUILD ═ OC':'3D · FIRST GATE · drag to orbit')
      :(crew?'3D · BUILD ═ OPENCLAW':'3D NEURAL · drag to orbit'));
  const chip=document.getElementById('crewchip');
  if(chip){
    chip.textContent=crew?'BUILD ═ OC':'CREW';
    chip.className=crew?'chip crew':'chip';
  }
  const gc=document.getElementById('gatechip');
  if(gc) gc.className=gate?'chip gate':'chip';
  const calls=document.getElementById('calls');
  calls.innerHTML='';
  let callList=(S.callouts||[]).slice();
  const want=['baja','first','build','oc'];
  callList=[...callList.filter(c=>want.includes(c.id)), ...callList.filter(c=>!want.includes(c.id)&&c.id!=='bot')];
  callList.slice(0,3).forEach(c=>{
    if(!N[c.id]) return;
    const p=P(c.id);
    const el2=document.createElement('div');
    el2.className='call';
    el2.textContent=c.text;
    el2.style.left=p.x+'px';
    el2.style.top=p.y+'px';
    calls.appendChild(el2);
  });
  const Pths=pathMap();
  (S.events||[]).forEach(e=>{
    if(!e||!e.id||seen.has(e.id)) return;
    const key=e.path==='code'?'gate':e.path;
    const path=(Pths[key]||Pths.gate||[]).filter(n=>N[n]);
    if(path.length<2) return;
    seen.add(e.id);
    jobs.push({path, t:0, v:0.004, col:COL[path[0]]||COL.first});
  });
}
function stateUrl(){
  let p=location.pathname||'/';
  if(/\/[^/]+\.[A-Za-z0-9]+$/.test(p)) p=p.replace(/[^/]+$/,'');
  else if(!p.endsWith('/')) p=p+'/';
  return p+'state.json?t='+Date.now();
}
async function boot(){
  const urls=[];
  if(/vercel\.app/.test(location.host)) urls.push('/api/state/?t='+Date.now());
  urls.push('https://grok-command.vercel.app/api/state/?t='+Date.now());
  urls.push(stateUrl());
  let lastErr=null;
  for(const u of urls){
    try{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      S=await r.json();
      if(!S || typeof S!=='object') throw new Error('bad json');
      resize(); render();
      return;
    }catch(e){ lastErr=e; }
  }
  const b=document.getElementById('mbanner');
  if(b) b.textContent='STATE FAIL · '+lastErr;
}
function clock(){
  const d=new Date();
  const z=n=>String(n).padStart(2,'0');
  document.getElementById('kClk').textContent=`${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
C.addEventListener('pointerdown', e=>{ drag=true; auto=false; lx=e.clientX; ly=e.clientY; try{C.setPointerCapture(e.pointerId)}catch(err){} });
C.addEventListener('pointermove', e=>{
  if(!drag) return;
  yaw+=(e.clientX-lx)*0.006;
  pitch=Math.max(-0.7, Math.min(0.85, pitch+(e.clientY-ly)*0.005));
  lx=e.clientX; ly=e.clientY;
});
C.addEventListener('pointerup', ()=>{ drag=false; });
C.addEventListener('wheel', e=>{ e.preventDefault(); dist=Math.max(1.35, Math.min(3.4, dist+e.deltaY*0.002)); }, {passive:false});
addEventListener('resize', ()=>{ resize(); render(); });
setInterval(boot, 4000);
setInterval(clock, 1000);
clock();
resize();
boot();
requestAnimationFrame(frame);
</script>
</body>
